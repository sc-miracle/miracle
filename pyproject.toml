[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scmiracle"
version = '0.1.0'
description = "MIRACLE: continual integration and label transfer for single-cell multimodal data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "labomics", email = "omicshub@outlook.com" }
]
keywords = ["single-cell", "multi-omics", "integration", "pytorch", "scanpy", "anndata", "mudata", "continual learning", "continual integration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

# --- Runtime dependencies (minimal but complete for your current imports) ---
dependencies = [
  "scmidas==0.3.0",

  # PyTorch (pin to same minor to avoid incompatibilities)
  "torch>=2.5,<2.6",
  "torchvision>=0.20,<0.21",
  "torchaudio>=2.5,<2.6",

  # Lightning: you import pytorch_lightning.utilities.rank_zero_only
  "lightning>=2.4,<2.7",

  # Scientific stack
  "numpy>=1.23,<3",
  "scipy>=1.9,<2",
  "pandas>=1.5,<3",
  "scikit-learn>=1.2,<2",
  "matplotlib>=3.7,<4",

  # Single-cell ecosystem
  "anndata>=0.10,<0.13",
  "mudata>=0.3,<0.4",
  "scanpy>=1.10,<2",
  "zarr>=2,<3",

  # Utilities you actually import/use
  "tqdm>=4.64,<5",
  "requests>=2.28,<3",
  "toml>=0.10,<1",
  "tomli>=2,<3; python_version<'3.11'",
  "natsort>=8,<9",
]

[project.urls]
Homepage = "https://github.com/sc-miracle/miracle"
Issues = "https://github.com/sc-miracle/miracle/issues"

# --- Optional dependencies (extras) ---
[project.optional-dependencies]
# Notebook / interactive
notebook = [
  "ipykernel>=6,<7",
]

# Dev / test / release tooling
dev = [
  "pytest>=7,<9",
  "pytest-cov>=4,<6",
  "ruff>=0.5,<1",
  "mypy>=1.7,<2",
  "build>=1,<2",
  "twine>=5,<6",
  "pip-tools>=7,<8",
]

# Docs (可选)
docs = [
  "Sphinx>=8,<9",
  "sphinx-book-theme>=1.1,<2",
  "sphinx-copybutton>=0.5,<1",
  "sphinx-markdown-tables>=0.0.17,<1",
  "recommonmark>=0.7,<1",
  "nbsphinx>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["scmiracle*"]

# --- Ruff (optional) ---
[tool.ruff]
line-length = 100
target-version = "py310"
